# Alembic configuration file.
# sqlalchemy.url is intentionally left as a placeholder; the real URL is
# injected in migrations/env.py from the ALEMBIC_DATABASE_URL environment
# variable.  Do not commit real credentials here.

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
