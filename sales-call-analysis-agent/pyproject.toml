[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sales-call-agent"
version = "0.1.0"
description = "Sales call analysis agent: transcription, diarization, and rubric-based evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "alembic>=1.14,<2",
]
asr = [
    "faster-whisper>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sales_call_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: opt-in tests that may load local ASR models (deselect with '-m \"not slow\"')",
    "postgres: requires live PostgreSQL (enable with RUN_POSTGRES_TESTS=1 and POSTGRES_TEST_URL)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
